name: yene_verify
description: Verify any Ethiopian bank payment. In seconds.
publish_to: none
version: 1.0.0+1

dependency_overrides:
  # Downgraded so the iOS/macOS implementation stays pre-objective_c: the
  # 2.6 native-asset hook fails on this machine (Dart SDK path contains
  # spaces — "flutter sdk", "hp 840 g8") and breaks ALL builds/tests.
  # TODO(baglog#29): remove when hook runs don't trigger on Windows hosts.
  path_provider_foundation: 2.4.1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.1

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # HTTP
  dio: ^5.4.3+1

  # Storage
  flutter_secure_storage: ^9.0.0
  # TODO(step21+): Isar 3.x is incompatible with AGP 8+ (namespace requirement).
  # Re-add via isar_community (or Isar 4) when offline caching is implemented.
  # isar: ^3.1.0+1
  # isar_flutter_libs: ^3.1.0+1

  # Auth
  local_auth: ^2.2.0
  google_sign_in: ^6.2.2

  # Media
  image_picker: ^1.1.2
  camera: ^0.12.0+1
  cached_network_image: ^3.3.1

  # Push
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1

  # UI
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  permission_handler: ^11.3.1

  # Export
  pdf: ^3.11.0
  # TODO(step21+): printing 5.x pins androidx deps needing compileSdk 34.
  # Re-add a current major when receipt export is implemented.
  # printing: ^5.13.1

  # Device
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # Observability
  logger: ^2.4.0
  # TODO(step21+): sentry_flutter 7.x pins an unsupported Kotlin language
  # version. Re-add a current major when telemetry is wired up.
  # sentry_flutter: ^7.19.0

  # Utils
  intl: ^0.20.3
  crypto: ^3.0.3
  flutter_image_compress: ^2.3.0
  zxing2: ^0.2.4
  image: 4.9.2
  google_mlkit_text_recognition: ^1.0.1
  firebase_auth: ^4.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the verify flow on a real device/emulator (Step 22B manual test).
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

  # l10n
  flutter_gen_runner: 5.6.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/images/logo/
    - assets/images/illustrations/
    - assets/images/onboarding/
    - assets/icons/
    - assets/banks/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: NotoSansEthiopic
      fonts:
        # TODO(step-21): split into 4 static weights (Regular/Medium/SemiBold/Bold)
        # when NotoSansEthiopic statics are sourced. For now the single
        # Google-Fonts variable TTF is registered as the 400-weight base;
        # Android's system Noto Sans Ethiopic covers bold fallback.
        - asset: assets/fonts/NotoSansEthiopic.ttf
          weight: 400

name: yene-verify

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: yene-backend:latest
    container_name: yene-backend
    restart: unless-stopped
    env_file: ../backend/.env.production
    networks:
      - yene-internal
    volumes:
      - ../.storage/receipts:/app/.storage/receipts
      - ../backend/secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      yene-postgres:
        condition: service_healthy
      yene-redis:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.yene-api.rule=Host(`verify-api.togttrading.com`)
      - traefik.http.routers.yene-api.entrypoints=websecure
      - traefik.http.routers.yene-api.tls.certresolver=letsencrypt
      - traefik.http.services.yene-api.loadbalancer.server.port=3000

  yene-postgres:
    image: postgres:16-alpine
    container_name: yene-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yene
      POSTGRES_PASSWORD: ${YENE_DB_PASSWORD}
      POSTGRES_DB: yene_verify
    volumes:
      - yene-pgdata:/var/lib/postgresql/data
    networks:
      - yene-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yene -d yene_verify"]
      interval: 5s
      timeout: 5s
      retries: 10

  yene-redis:
    image: redis:7-alpine
    container_name: yene-redis
    restart: unless-stopped
    networks:
      - yene-internal

  web-public:
    build:
      context: ../web
      dockerfile: public/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.mekatanker.shop/api/v1
    image: yene-web-public:latest
    container_name: yene-web-public
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.mekatanker.shop/api/v1
    ports:
      - "127.0.0.1:3101:3000"
    networks:
      - yene-internal
    depends_on:
      backend:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.yene-web.rule=Host(`verify.togttrading.com`)
      - traefik.http.routers.yene-web.entrypoints=websecure
      - traefik.http.routers.yene-web.tls=true
      - traefik.http.routers.yene-web.tls.certresolver=letsencrypt
      - traefik.http.services.yene-web.loadbalancer.server.port=3101

  web-admin:
    build:
      context: ../web
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.mekatanker.shop/api/v1
    image: yene-web-admin:latest
    container_name: yene-web-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: 1042108670897-mvf53pl5jnrqpe7kco0cl75bbgm9vfuh.apps.googleusercontent.com
      BACKEND_API_URL: https://verify-api.togttrading.com/api/v1
      NODE_ENV: production
    ports:
      - "127.0.0.1:3102:3000"
    networks:
      - yene-internal
    depends_on:
      backend:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.yene-admin.rule=Host(`verify-admin.togttrading.com`)
      - traefik.http.routers.yene-admin.entrypoints=websecure
      - traefik.http.routers.yene-admin.tls=true
      - traefik.http.routers.yene-admin.tls.certresolver=letsencrypt
      - traefik.http.services.yene-admin.loadbalancer.server.port=3102

networks:
  yene-internal:
    driver: bridge

volumes:
  yene-pgdata:

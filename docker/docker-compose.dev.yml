# ============================================================
# Yene Verify — Development Docker Compose
#
# Usage (from the repository root):
#   ./scripts/bootstrap.sh
# or:
#   docker compose --env-file docker/.env -f docker/docker-compose.dev.yml up -d
#
# Default services: postgres, redis, mailhog, minio, minio-init.
# The optional `api` profile is reserved for the backend image and is
# not started by the local bootstrap.
#
# All external integrations have deterministic local substitutes. No
# cloud credential is needed for development.
# ============================================================

name: yene-verify-dev

# File-backed secrets are read-only when the optional API profile runs.
# The default points at the tracked .gitkeep so a clean checkout can
# still run the infrastructure-only stack. Copy the example into the
# ignored file before enabling a real/mock adapter that needs it.
secrets:
  gcp-vision:
    file: ${GCP_VISION_CREDENTIALS_FILE:-./secrets/.gitkeep}
  fcm-private-key:
    file: ${FCM_PRIVATE_KEY_FILE:-./secrets/.gitkeep}

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  yene_dev:
    driver: bridge

services:
  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: yene_postgres_dev
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - yene_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yene}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yene_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-yene_verify}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yene} -d ${POSTGRES_DB:-yene_verify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: yene_redis_dev
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - yene_dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── MailHog (local SMTP + email preview UI) ───────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: yene_mailhog_dev
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - yene_dev
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    logging:
      driver: "none"

  # ── MinIO (S3-compatible local storage — Cloudflare R2 substitute) ────────
  minio:
    image: minio/minio:latest
    container_name: yene_minio_dev
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - yene_dev
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yene_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yene_minio_dev}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MinIO bucket initializer ─────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: yene_minio_init
    networks:
      - yene_dev
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-yene_minio} ${MINIO_ROOT_PASSWORD:-yene_minio_dev};
        mc mb --ignore-existing local/${MINIO_BUCKET:-yene-verify-receipts};
        mc mb --ignore-existing local/${MINIO_EXPORTS_BUCKET:-yene-verify-exports};
        echo 'MinIO buckets ready';
        exit 0;
      "
    restart: on-failure

  # ── Optional backend profile ─────────────────────────────────────────────
  # This service is intentionally not part of the default local stack. It
  # documents the production-style env injection and read-only secret mount.
  api:
    profiles: ["api"]
    image: ${API_IMAGE:-yeneverify/api:dev}
    container_name: yene_api_dev
    restart: unless-stopped
    env_file:
      - ../backend/.env
    networks:
      - yene_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-yene}:${POSTGRES_PASSWORD:-yene_dev_password}@postgres:5432/${POSTGRES_DB:-yene_verify}?schema=public
      REDIS_URL: redis://redis:6379
      VISION_CREDENTIALS_JSON: /run/secrets/gcp-vision.json
      FCM_PRIVATE_KEY_FILE: /run/secrets/fcm-private-key.txt
      MINIO_ENDPOINT: http://minio:9000
    secrets:
      - source: gcp-vision
        target: gcp-vision.json
        mode: 0400
      - source: fcm-private-key
        target: fcm-private-key.txt
        mode: 0400
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Info | Ethio Telecom</title>
</head>
<body class="tic-body">
  <!-- Reconstructed from published Telebirr receipt screenshots; names/amounts sanitized. -->
  <div id="root">
    <nav class="navbar">
      <div class="brand">
        <img src="/telebirr-logo.png" alt="telebirr" />
        <span>Ethio Telecom — Transaction Info</span>
      </div>
    </nav>
    <main class="container" id="mainContent">
      <div class="receipt-card">
        <div class="receipt-header">Transaction Receipt</div>
        <div class="receipt-body">
          <table class="table">
            <tbody>
              <tr><td class="label">Transaction Number</td><td id="txtTrnxNo">DEV230123HH</td></tr>
              <tr><td class="label">Payer Name</td><td id="txtPayerName">Abebe Kebede</td></tr>
              <tr><td class="label">Payer Telephone Number</td><td>0911XXXXXX</td></tr>
              <tr><td class="label">Receiver Name</td><td id="txtValueRequested">Selam Coffee</td></tr>
              <tr><td class="label">Amount (ETB)</td><td id="txtAmount">2,300.00</td></tr>
              <tr><td class="label">Telebirr Transaction Date</td><td id="txtTimestamp">2026-07-14 11:08:00</td></tr>
              <tr><td class="label">Status</td><td>Success</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <footer class="footer">Powered by Ethio Telecom &copy; 2026</footer>
  </div>
</body>
</html>

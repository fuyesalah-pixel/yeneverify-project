<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt Not Found | Awash Bank</title>
  <link href="/static/site.css" rel="stylesheet" />
</head>
<body class="error-page">
  <!-- Simplified from Awash's not-found page; sanitized. -->
  <header class="site-header">
    <div class="container">
      <img src="/static/awash-logo.png" alt="Awash Bank" class="bank-logo" />
      <span class="brand-text">Awash Bank</span>
    </div>
  </header>

  <div class="container error-container text-center">
    <h1 class="error-code">Not Found</h1>
    <h3>No record</h3>
    <p class="lead">
      No record exists for this transaction number. Please check the SMS
      from Awash Bank and try again.
    </p>
    <a href="/" class="btn btn-default hidden-print">Back to AwashPay</a>
  </div>

  <footer class="site-footer text-center">
    <p>&copy; 2026 Awash Bank. All rights reserved.</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt Not Found | Commercial Bank of Ethiopia</title>
  <link href="/assets/site.css" rel="stylesheet" />
</head>
<body class="error-page">
  <!-- Simplified from a real CBE not-found page; sanitized. -->
  <nav class="navbar navbar-inverse site-nav">
    <div class="container">
      <img src="/assets/cbe-logo.png" alt="Commercial Bank of Ethiopia" class="cbe-logo" />
      <span class="brand-text">Commercial Bank of Ethiopia</span>
    </div>
  </nav>

  <div class="container error-container text-center">
    <h1 class="error-code">404</h1>
    <h3>Receipt Not Found</h3>
    <p class="lead">
      The receipt you are looking for does not exist. Please check the reference
      number on your transaction SMS and try again.
    </p>
    <a href="/" class="btn btn-default hidden-print">Back to Home</a>
  </div>

  <footer class="site-footer text-center">
    <p>&copy; 2026 Commercial Bank of Ethiopia. All rights reserved.</p>
  </footer>
</body>
</html>
